name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lint checks
        run: |
          chmod +x scripts/ci/run-lint.sh
          scripts/ci/run-lint.sh

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run format checks
        run: |
          chmod +x scripts/ci/run-format.sh
          scripts/ci/run-format.sh

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run type checks
        run: |
          chmod +x scripts/ci/run-type.sh
          scripts/ci/run-type.sh

  package-metadata:
    runs-on: windows-latest
    needs: [lint, format, type]
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auto-sync Scoop/Winget hashes (main push)
        id: sync
        shell: pwsh
        run: |
          ./scripts/ci/run-package-metadata.ps1 -EventName '${{ github.event_name }}' -Ref '${{ github.ref }}' -Actor '${{ github.actor }}' -GithubOutputPath $env:GITHUB_OUTPUT

  test:
    runs-on: windows-latest
    needs: [lint, format, type]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: pwsh
        run: |
          ./scripts/ci/run-tests.ps1

  package:
    runs-on: ubuntu-latest
    needs: [lint, format, type, test, package-metadata]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run packaging
        run: |
          chmod +x scripts/ci/run-package.sh
          scripts/ci/run-package.sh
      - name: Sync package manager hashes from packaged artifact
        shell: pwsh
        run: |
          ./scripts/sync-package-hashes-from-artifact.ps1
      - name: Commit package hash updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if ! git diff --quiet -- bucket/magickeyboard.json winget/magickeyboard.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bucket/magickeyboard.json winget/magickeyboard.yaml
            git commit -m "ci: sync package hashes from artifact"
            git push
          fi
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: layouts-archive
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: [package, package-metadata]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: layouts-archive
          path: dist/
      - name: Create release
        run: |
          gh release create "$GITHUB_RUN_ID" dist/* --title "Release $GITHUB_RUN_ID" --notes "Automated release $GITHUB_RUN_ID"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
