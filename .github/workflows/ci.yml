name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lint checks
        run: |
          chmod +x scripts/check-lint.sh
          scripts/check-lint.sh

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run format checks
        run: |
          chmod +x scripts/check-format.sh
          scripts/check-format.sh

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run type checks
        run: |
          echo "No type checking applicable for this project"

  package-metadata:
    runs-on: windows-latest
    needs: [lint, format, type]
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auto-sync Scoop/Winget hashes (main push)
        id: sync
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}' -eq 'refs/heads/main' -and '${{ github.actor }}' -ne 'github-actions[bot]') {
            ./scripts/sync-package-hashes.ps1
            $changed = (git status --porcelain -- bucket/magickeyboard.json winget/magickeyboard.yaml)
            if (-not [string]::IsNullOrWhiteSpace($changed)) {
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add bucket/magickeyboard.json winget/magickeyboard.yaml
              git commit -m "ci: sync package hashes"
              git push
              "updated=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            }
          }
          "updated=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Verify Scoop/Winget metadata
        shell: pwsh
        run: |
          ./scripts/verify-package-metadata.ps1

  test:
    runs-on: ubuntu-latest
    needs: [lint, format, type]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          chmod +x scripts/run-tests.sh
          scripts/run-tests.sh
      - name: Run translation tests (POSIX)
        run: |
          chmod +x scripts/test-translations.sh
          scripts/test-translations.sh

  package:
    runs-on: ubuntu-latest
    needs: [lint, format, type, test, package-metadata]
    if: needs.package-metadata.outputs.updated != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Read package version from Scoop manifest
        id: meta
        run: |
          version=$(jq -r '.version' bucket/magickeyboard.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run packaging
        run: |
          chmod +x scripts/package_layouts.sh
          scripts/package_layouts.sh "${{ steps.meta.outputs.version }}"
      - name: Create full repo zip
        run: |
          zip -r MagicKeyboard-all.zip . --exclude dist/ --exclude .git/ --exclude .github/ --exclude bucket/ --exclude winget/ --exclude tests/ --exclude .gitattributes --exclude .gitignore
      - name: Prepare release artifacts
        run: |
          cp "All.Keyboard.Layouts.${{ steps.meta.outputs.version }}.zip" dist/ || true
          cp MagicKeyboard-all.zip dist/ || true
          cp magickeyboard1_AppleKeyboardInstaller64.exe dist/ || true
          cp magickeyboard2_AppleKeyboardInstaller64.exe dist/ || true
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: layouts-archive
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: [package, package-metadata]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.package-metadata.outputs.updated != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: layouts-archive
          path: dist/
      - name: Create release
        run: |
          gh release create "$GITHUB_RUN_ID" dist/* --title "Release $GITHUB_RUN_ID" --notes "Automated release $GITHUB_RUN_ID"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
